# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
CDevice_KickOff                         = ["edx"]                                           # device
D3D_InternalRelease                     = ["esi"]                                           # resource
D3D_MakeRequestedSpace                  = ["stack", "eax"]                                  # minimum, requested (DrawVertices 0x25FCE3)
D3DDevice_DrawVertices                  = ["stack", "ecx", "eax"]                           # prim, start, count (0x19D4C9)
D3DDevice_EnableOverlay                 = ["eax"]                                           # argument unused by the library, pops 0
D3DDevice_LightEnable                   = ["eax", "stack"]                                  # index, enable (0x19F925)
D3DDevice_SelectVertexShader            = ["eax", "ebx"]                                    # handle, address (0x25BE7D)
D3DDevice_SetIndices                    = ["ebx", "stack"]                                  # index data, base vertex (0x19E5EE)
D3DDevice_SetPixelShader                = ["eax"]
D3DDevice_SetRenderStateNotInline       = ["esi", "edi"]                                    # state, value (0x19DE57)
D3DDevice_SetShaderConstantMode         = ["eax"]
D3DDevice_SetStreamSource               = ["eax", "ebx", "stack"]                           # stream, buffer, stride (0x19C5F9)
D3DDevice_SetTexture                    = ["eax", "stack"]                                  # stage, texture (0x14B87F)
D3DDevice_SetTextureState_TexCoordIndex = ["esi", "stack"]                                  # stage, value (0x17E778)
D3DDevice_SetTransform                  = ["eax", "edx"]                                    # state, matrix (0x43533)
D3DDevice_Swap                          = ["eax"]                                           # flags
D3DResource_IsBusy                      = ["eax"]                                           # resource (0x14E69C)
Direct3D_CreateDevice                   = ["edx", "ebx", "esi", "eax", "stack", "ecx"]      # adapter, type, window unused; flags, params, device out (0x198D3D)

# src/game/hooks.cpp: the movie player's inlined D3DDevice_Release (0x0014E720) would run the device teardown
# 0x002570D0, which waits on GPU registers the host device does not have. Keep the device, as the runtime's Release does.
[[hook]]
at = 0x14E750
call = "KeepD3DDevice"
on_true = 0x14E76D
